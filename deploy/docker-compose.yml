# The compose file production runs the hub with. Installed root:root 0644 at
# /opt/dashboard-x-deploy/docker-compose.yml and used by deploy.sh.
#
# Not one from a delivered commit: a compose file can ask for `privileged`, a
# host mount of / or the Docker socket -- root on the host. Changing this one
# needs root on the server, on purpose. No `build:` section: deploy.sh builds
# with the pinned Dockerfile beside this file.
#
# tests/deploy/test_deploy_policy.py pins the security-relevant parts.
#
# The reverse proxy is the nginx already on the host (owner's choice,
# 2026-10-03; deploy/nginx/). It reaches the hub on 127.0.0.1:8790 through
# `edge`, whose gateway is the only address whose X-Forwarded-For the hub
# trusts. `edge` uses 10.231.90.0/24: the 172.16/12 ranges are taken by the
# other bots on this server (italy-affiliaterxbot has 172.31.0.0/16).

name: dashboard-x

services:
  hub:
    image: dashboard-x:${APP_VERSION:-current}
    pull_policy: never
    container_name: dashboard-x-hub
    restart: unless-stopped
    init: true
    user: "10001:10001"

    env_file:
      - /home/deploy/Bots_web_dashboard/shared/.env
    environment:
      HUB_DATA_DIR: /data
      HUB_BOTS_DIR: /config
      # uvicorn takes the client address from X-Forwarded-For only when the
      # connection comes from here: the host side of `edge`.
      FORWARDED_ALLOW_IPS: 10.231.90.1
      HOME: /tmp

    volumes:
      # hub.db, its backups -- the only writable place.
      - /home/deploy/Bots_web_dashboard/shared/data:/data
      # Each bot's config.toml (display name, API URL). Read-only.
      - /home/deploy/Bots_web_dashboard:/config:ro

    ports:
      - "127.0.0.1:8790:8000"

    networks:
      - edge
      - hub_net

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    pids_limit: 64
    stop_grace_period: 10s

    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      start_interval: 3s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    ipam:
      config:
        - subnet: 10.231.90.0/24
          gateway: 10.231.90.1
  # Made on the server beforehand (docker network create --internal hub_net),
  # shared with every bot's API; compose only joins it.
  hub_net:
    external: true
