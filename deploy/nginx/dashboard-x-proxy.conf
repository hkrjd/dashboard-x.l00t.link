# Installed by root as /etc/nginx/snippets/dashboard-x-proxy.conf; included
# by every location of the dashboard-x site.
proxy_pass http://127.0.0.1:8790;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Set, never appended: the hub must see the real client, and nothing a
# client sends may change it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 60s;
