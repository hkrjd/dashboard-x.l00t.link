# nginx site for the hub, on the host nginx that already serves the other
# l00t.link and shortener sites (owner's choice, 2026-10-03; no server_name
# clash, checked with `nginx -T` the same day).
#
# Installed by root as /etc/nginx/sites-available/dashboard-x.l00t.link and
# linked from sites-enabled. Needs the certificate first -- see
# deploy/README.md, "Reverse proxy". Then: nginx -t && systemctl reload nginx
#
# The hub listens on 127.0.0.1:8790 (deploy/docker-compose.yml). It trusts
# X-Forwarded-For only from the Docker gateway, and this file SETS the header
# to the real client address, never appends to what the client sent.

# Brute-force brake in front of the hub's own limits: 10 login posts a
# minute per address. (A site file is read inside nginx's http block.)
limit_req_zone $binary_remote_addr zone=dashx_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name dashboard-x.l00t.link;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dashboard-x.l00t.link;

    ssl_certificate /etc/letsencrypt/live/dashboard-x.l00t.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard-x.l00t.link/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;
    server_tokens off;

    location = /login {
        limit_req zone=dashx_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dashboard-x-proxy.conf;
    }
    location = /login/otp {
        limit_req zone=dashx_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/dashboard-x-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/dashboard-x-proxy.conf;
    }
}
