<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "includeIndicatorStyles": false, "historyCacheSize": 0}'>
<title>{% block title %}dashboard-x{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script src="/static/htmx.min.js" defer></script>
</head>
<body{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
{% if signed_in %}
<header class="top">
  <a class="brand" href="/">dashboard-x</a>
  <nav>
    <a href="/">Bots</a>
    <a href="/security">Security</a>
    <a href="/audit">Audit log</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Log out</button>
    </form>
  </nav>
</header>
{% endif %}
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
