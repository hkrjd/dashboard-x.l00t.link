{% extends "base.html" %}
{% block title %}Code · dashboard-x{% endblock %}
{% block main %}
<section class="auth">
  <h1>Authenticator code</h1>
  {% if error %}<p class="flash bad" role="alert">{{ error }}</p>{% endif %}
  <form class="stack" method="post" action="/login/otp">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>6-digit code, or a backup code
      <input name="code" autocomplete="one-time-code" required autofocus maxlength="20">
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted"><a href="/login">Start again</a></p>
</section>
{% endblock %}
